name: CI / Production Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: healthyapi
          POSTGRES_PASSWORD: local_dev_password
          POSTGRES_DB: healthyapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://healthyapi:local_dev_password@localhost:5432/healthyapi?schema=public"

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://healthyapi:local_dev_password@localhost:5432/healthyapi?schema=public"

      - name: Run Vitest Unit & Integration Suites
        run: npm test

      - name: Build Next.js Web App
        run: npm run build
        env:
          DATABASE_URL: "postgresql://healthyapi:local_dev_password@localhost:5432/healthyapi?schema=public"
          REDIS_URL: "redis://localhost:6379"
          NEXTAUTH_SECRET: "ci_temporary_secret_key_32_characters"
